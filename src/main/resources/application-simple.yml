spring:
  application:
    name: textbook-rag-assistant
  
  # Use H2 in-memory database for simple startup
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Server configuration
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Logging
logging:
  level:
    com.textbookassistant: INFO
    org.springframework: INFO
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Disable Ollama for simple startup
ollama:
  base-url: http://localhost:11434
  model: llama2
  embedding-model: nomic-embed-text
  temperature: 0.7
  max-tokens: 2048

# Application Configuration
app:
  chunk:
    size: 300
    overlap: 50
  max-retrieval-results: 3
  upload:
    dir: /tmp/uploads
  processed:
    dir: /tmp/processed
