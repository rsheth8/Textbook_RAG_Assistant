spring:
  application:
    name: textbook-rag-assistant
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        connection:
          provider_disables_autocommit: true
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Ollama Configuration
ollama:
  base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
  model: ${OLLAMA_MODEL:llama2}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  temperature: ${OLLAMA_TEMPERATURE:0.7}
  max-tokens: ${OLLAMA_MAX_TOKENS:2048}

# Application Configuration
app:
  chunk:
    size: ${CHUNK_SIZE:300}
    overlap: ${CHUNK_OVERLAP:50}
  max-retrieval-results: ${MAX_RETRIEVAL_RESULTS:3}
  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}
  processed:
    dir: ${PROCESSED_DIR:/tmp/processed}

# Logging
logging:
  level:
    com.textbookassistant: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.postgresql: DEBUG
    com.zaxxer.hikari: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Server configuration
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
