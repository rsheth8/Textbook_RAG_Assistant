spring:
  application:
    name: textbook-rag-assistant

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        connection:
          provider_disables_autocommit: true
  
  # Alternative database configuration using individual properties
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    database: ${POSTGRES_DB}
    # url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
    # username: ${PGUSER:postgres}
    # password: ${PGPASSWORD:}
    driver-class-name: org.postgresql.Driver
    
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Disable problematic auto-configurations
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration

# Ollama Configuration
ollama:
  base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
  model: ${OLLAMA_MODEL:llama2}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  temperature: ${OLLAMA_TEMPERATURE:0.7}
  max-tokens: ${OLLAMA_MAX_TOKENS:2048}

# Application Configuration
app:
  chunk:
    size: ${CHUNK_SIZE:300}
    overlap: ${CHUNK_OVERLAP:50}
  max-retrieval-results: ${MAX_RETRIEVAL_RESULTS:3}
  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}
  processed:
    dir: ${PROCESSED_DIR:/tmp/processed}

# Logging
logging:
  level:
    com.textbookassistant: INFO
    org.springframework.ai: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.postgresql: DEBUG
    com.zaxxer.hikari: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Server configuration
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  health:
    db:
      enabled: true
    defaults:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: false
    enable:
      jvm: true
      process: true
      system: false
      processor: false
      disk: false
    binders:
      processor:
        enabled: false
      system:
        enabled: false
      disk:
        enabled: false
