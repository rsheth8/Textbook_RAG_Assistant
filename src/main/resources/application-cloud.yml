spring:
  application:
    name: textbook-rag-assistant
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/textbook_assistant}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Add connection test query for better error handling
      connection-test-query: SELECT 1
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Spring AI Configuration
spring.ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat:
      options:
        model: ${OLLAMA_MODEL:phi3}
        temperature: ${OLLAMA_TEMPERATURE:0.7}
        max-tokens: ${OLLAMA_MAX_TOKENS:2048}
    embedding:
      options:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  
  vectorstore:
    pgvector:
      dimensions: 768
      initialize-schema: true

# Application Configuration
app:
  chunk:
    size: ${CHUNK_SIZE:300}
    overlap: ${CHUNK_OVERLAP:50}
  max-retrieval-results: ${MAX_RETRIEVAL_RESULTS:3}
  upload:
    dir: ${UPLOAD_DIR:/tmp/uploads}
  processed:
    dir: ${PROCESSED_DIR:/tmp/processed}

# Logging - Add more detailed logging for debugging
logging:
  level:
    com.textbookassistant: INFO
    org.springframework.ai: INFO
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.boot.autoconfigure.jdbc: DEBUG
    com.zaxxer.hikari: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Server configuration
server:
  port: ${PORT:8080}

# Actuator - Disable problematic metrics
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      simple:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration

